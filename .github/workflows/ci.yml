name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --extra dev pytest tests/unit tests/security tests/integration -v --tb=short

  ruff_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Ruff review report
        continue-on-error: true
        run: |
          mkdir -p reports
          UV_CACHE_DIR=$PWD/.uv-cache uv run python scripts/review_ruff.py --json --output reports/ruff-review.json

      - name: Upload Ruff review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-review
          path: reports/ruff-review.json
          if-no-files-found: error

      - name: Write Ruff review summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("reports/ruff-review.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not report_path.exists():
              summary_path.write_text(
                  "## Ruff review summary\n\n- report: missing\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          lines = [
              "## Ruff review summary",
              "",
              f"- ruff check: {report['ruff_check']}",
              f"- ruff format --check: {report['ruff_format_check']}",
              f"- format-first files: {len(report['format_first_files'])}",
              f"- lint-only files: {len(report['lint_only_files'])}",
              "- top recurring rule IDs:",
          ]

          top_rules = report["top_recurring_rule_ids"][:3]
          if top_rules:
              lines.extend(
                  f"  - {item['rule_id']}: {item['count']}"
                  for item in top_rules
              )
          else:
              lines.append("  - none")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
