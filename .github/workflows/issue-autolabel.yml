name: Auto Label Issues

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply inferred issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const available = new Set(existing.map((label) => label.name));

            const inferred = new Set();

            const addIfAvailable = (label) => {
              if (available.has(label)) {
                inferred.add(label);
              }
            };

            if (
              issue.title.startsWith("fix(") ||
              /\b(bug|fail|fails|failing|broken|error|regression|unable)\b/.test(text)
            ) {
              addIfAvailable("bug");
            }

            if (
              issue.title.startsWith("docs(") ||
              /\b(readme|deploy|report|video|documentation|docs?)\b/.test(text)
            ) {
              addIfAvailable("documentation");
              addIfAvailable("docs");
            }

            if (
              issue.title.startsWith("feat(") ||
              issue.title.startsWith("enhancement(") ||
              /\b(feature|enhancement|improve|improvement|support)\b/.test(text)
            ) {
              addIfAvailable("enhancement");
            }

            if (
              issue.title.startsWith("test(") ||
              /\b(test|testing|pytest|coverage)\b/.test(text)
            ) {
              addIfAvailable("tests");
            }

            if (
              issue.title.startsWith("ci(") ||
              /\b(ci|workflow|github actions|pre-commit|labeler|automation)\b/.test(text)
            ) {
              addIfAvailable("ci");
            }

            if (
              /\b(security|tls|totp|replay|auth|encryption|cert|certificate|pin-cert|ca-cert)\b/.test(text)
            ) {
              addIfAvailable("security");
            }

            if (/\b(client|login|chat|message|friend|conversation)\b/.test(text)) {
              addIfAvailable("client");
            }

            if (/\b(ui|screen|widget|banner|textual)\b/.test(text)) {
              addIfAvailable("ui");
            }

            if (/\b(server|api|websocket|database|db|sqlite|migration)\b/.test(text)) {
              addIfAvailable("server");
            }

            if (
              issue.title.startsWith("question") ||
              /\b(how do i|how to|question|\?)\b/.test(text)
            ) {
              addIfAvailable("question");
            }

            const labels = [...inferred];
            if (labels.length === 0) {
              core.info("No matching labels inferred.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels,
            });

            core.info(`Applied labels: ${labels.join(", ")}`);
