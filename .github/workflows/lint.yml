name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run --extra dev ruff check .

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: MyPy
        run: uv run --extra dev mypy client server

      - name: Check silent broad excepts
        run: uv run python scripts/check_silent_excepts.py

      - name: Check stale security claims
        run: uv run python scripts/check_stale_security_claims.py

      - name: Git diff whitespace check
        run: git diff --check
