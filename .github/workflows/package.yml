name: Package

on:
  workflow_dispatch:
  push:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute archive stamp
        run: |
          echo "BUILD_STAMP=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/DEPLOY.md
          test -d client
          test -d server
          test -d shared
          test -d tests
          test -f scripts/build_release_zip.sh

      - name: Create release zip
        run: |
          bash scripts/build_release_zip.sh
          mv release/project-release.zip "release/project-release-${BUILD_STAMP}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: project-release-${{ env.BUILD_STAMP }}
          path: release/project-release-${{ env.BUILD_STAMP }}.zip
