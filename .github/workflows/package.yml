name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/DEPLOY.md
          test -d client
          test -d server
          test -d shared
          test -d tests
          test -f scripts/build_release_zip.sh

      - name: Create release zip
        run: |
          bash scripts/build_release_zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: project-release-zip
          path: release/project-release.zip
