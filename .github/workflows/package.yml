name: Package

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute archive stamp
        run: |
          echo "BUILD_STAMP=$(date -u +%Y%m%d-%H%M%S)-run${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=submission-$(date -u +%Y%m%d-%H%M%S)-run${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/DEPLOY.md
          test -f install.sh
          test -f install.bat
          test -d client
          test -d server
          test -d shared
          test -d tests
          test -f scripts/build_submission_zip.sh

      - name: Create submission zip
        run: |
          bash scripts/build_submission_zip.sh 71
          mv submission/71.zip "submission/71-${BUILD_STAMP}.zip"

      - name: Upload submission artifact
        uses: actions/upload-artifact@v6
        with:
          name: submission-71-${{ env.BUILD_STAMP }}
          path: submission/71-${{ env.BUILD_STAMP }}.zip

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Submission ${{ env.BUILD_STAMP }}
          prerelease: true
          generate_release_notes: true
          files: |
            submission/71-${{ env.BUILD_STAMP }}.zip
