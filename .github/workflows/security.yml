name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install project dependencies
        run: uv sync --frozen --extra dev

      - name: Collect PR-relevant files
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "bandit_files="
              echo "secret_files="
              echo "dependency_files_changed=false"
              echo "use_scope=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed_files="$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD")"
          bandit_files="$(printf '%s\n' "$changed_files" | grep -E '^(client/(api|ui|use_cases)|server/(api|core|ws))/.*\.py$' || true)"
          secret_files="$(printf '%s\n' "$changed_files" | grep -v '^docs/plans/' || true)"
          dependency_files_changed=false
          if printf '%s\n' "$changed_files" | grep -Eq '^(pyproject\.toml|uv\.lock)$'; then
            dependency_files_changed=true
          fi

          {
            echo "bandit_files<<EOF"
            printf '%s\n' "$bandit_files"
            echo "EOF"
            echo "secret_files<<EOF"
            printf '%s\n' "$secret_files"
            echo "EOF"
            echo "dependency_files_changed=$dependency_files_changed"
            echo "use_scope=true"
          } >> "$GITHUB_OUTPUT"

      - name: Bandit
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.use_scope }}" == "true" ]]; then
            scoped_files="${{ steps.scope.outputs.bandit_files }}"
            if [[ -z "$scoped_files" ]]; then
              echo "No security-relevant Python files changed; skipping scoped Bandit scan."
              exit 0
            fi
            mapfile -t files <<< "$scoped_files"
            uv tool run --from bandit bandit -q "${files[@]}"
            exit 0
          fi
          uv tool run --from bandit bandit -q -r client server scripts shared

      - name: pip-audit
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.use_scope }}" == "true" && "${{ steps.scope.outputs.dependency_files_changed }}" != "true" ]]; then
            echo "No dependency manifest changes; skipping PR-scoped pip-audit."
            exit 0
          fi
          # CVE-2026-4539 currently has no fixed Pygments release available on PyPI.
          uv tool run --from pip-audit pip-audit --ignore-vuln CVE-2026-4539

      - name: detect-secrets
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.use_scope }}" == "true" ]]; then
            scoped_files="${{ steps.scope.outputs.secret_files }}"
            if [[ -z "$scoped_files" ]]; then
              echo "No tracked files changed; skipping scoped detect-secrets scan."
              exit 0
            fi
            mapfile -t files <<< "$scoped_files"
            uv tool run --from detect-secrets detect-secrets-hook --baseline .secrets.baseline "${files[@]}"
            exit 0
          fi
          git ls-files -z -- . ':(exclude)docs/plans/**' \
            | xargs -0 uv tool run --from detect-secrets detect-secrets-hook --baseline .secrets.baseline
