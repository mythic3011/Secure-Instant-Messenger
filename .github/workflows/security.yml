name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install project dependencies
        run: uv sync --frozen --extra dev

      - name: Bandit
        run: uv tool run --from bandit bandit -q -r client server scripts shared

      - name: pip-audit
        run: uv tool run --from pip-audit pip-audit

      - name: detect-secrets
        run: |
          git ls-files -z \
            | xargs -0 uv tool run --from detect-secrets detect-secrets-hook --baseline .secrets.baseline
