name: Submission Package

on:
  workflow_dispatch:

jobs:
  build-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate required repo files
        run: |
          test -d client
          test -d server
          test -d shared
          test -f docs/DEPLOY.md
          test -f install.sh
          test -f install.bat
          test -f server/migrations/001_init.sql
          test -f scripts/build_submission_zip.sh
          test -f scripts/install/bootstrap-env.bat
          test -f scripts/lib/bootstrap_env.py
          test -f scripts/launch/run-server.bat
          test -f scripts/launch/run-client.bat

      - name: Build Team 71 submission zip
        run: |
          bash scripts/build_submission_zip.sh 71

      - name: Validate packaged bootstrap/runtime helpers
        run: |
          unzip -l submission/71.zip | grep '71/code/install.sh'
          unzip -l submission/71.zip | grep '71/code/install.bat'
          unzip -l submission/71.zip | grep '71/code/scripts/install/bootstrap-env.bat'
          unzip -l submission/71.zip | grep '71/code/scripts/lib/bootstrap_env.py'
          unzip -l submission/71.zip | grep '71/code/scripts/launch/run-server.bat'
          unzip -l submission/71.zip | grep '71/code/scripts/launch/run-client.bat'
          ! unzip -l submission/71.zip | grep '71/report.'
          ! unzip -l submission/71.zip | grep '71/video.'

      - name: Upload submission zip
        uses: actions/upload-artifact@v6
        with:
          name: submission-71
          path: submission/71.zip
