# docker-compose.yml
# Deploy with: docker compose up --build
# Requires: Docker 24+ with Compose V2

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: runtime
    env_file:
      - path: .env.local
        required: false
    labels:
      - dev.orbstack.https-port=8443 # L4 passthrough — prevents OrbStack double-TLS (alert 46)
    ports:
      - "127.0.0.1:8443:8443" # HTTPS/WSS — bind to localhost only in dev
    volumes:
      - server_data:/app/data # SQLite database persisted here
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, ssl; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8443/health', context=ctx)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

volumes:
  server_data:

networks:
  internal:
    driver: bridge
